<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCAS DROPS</title>
  <link rel="stylesheet" href="Style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Sticky Header -->
  <header class="site-header">
    <div class="header-left">
      <a href="#" class="brand-title">SCAS DROPS</a>
      <span class="header-tagline">LIMITED EXPERIMENTS</span>
    </div>
    <div class="header-right">
      <a href="https://github.com/bazzapotato/website-scas-drops" target="_blank" rel="noopener" class="header-link">GitHub ↗</a>
      <button id="themeToggle" class="header-btn" aria-label="Toggle inverted contrast">INV</button>
    </div>
  </header>

  <!-- Filter & Search Toolbar -->
  <section class="toolbar">
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all">ALL (<span id="countAll">0</span>)</button>
      <button class="filter-btn" data-filter="live">LIVE</button>
      <button class="filter-btn" data-filter="upcoming">UPCOMING</button>
      <button class="filter-btn" data-filter="sold_out">SOLD OUT</button>
      <button class="filter-btn" data-filter="archived">ARCHIVE</button>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="SEARCH DROPS..." autocomplete="off">
    </div>
  </section>

  <!-- Drops Grid Container -->
  <main class="grid-container" id="dropsGrid">
    <!-- Drops dynamically injected via JS/App.js -->
  </main>

  <!-- Drop Detail Modal -->
  <div class="modal-overlay" id="dropModal">
    <div class="modal-content">
      <button class="modal-close" id="modalCloseBtn">&times;</button>
      <div class="modal-body" id="modalBody">
        <!-- Injected via JavaScript -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <p>&copy; <span id="currentYear"></span> SCAS DROPS. ALL RIGHTS RESERVED.</p>
  </footer>

  <!-- Scripts -->
 
  <script src="JS/drops/"></script>


  <!-- Main Render Engine -->
  <script src="JS/App.js?v=2"></script>
</body>
</html>
